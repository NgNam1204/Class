<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thử thách 10s (May mắn)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }

        h1 { font-size: 2rem; margin-bottom: 10px; }
        .target { color: #e67e22; font-weight: bold; font-size: 2.2rem; }

        #timer {
            font-size: 6rem;
            font-weight: bold;
            font-family: monospace;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            width: 320px;
            text-align: center;
        }

        #actionBtn {
            padding: 15px 50px;
            font-size: 1.5rem;
            cursor: pointer;
            border: none;
            border-radius: 50px;
            background-color: #27ae60;
            color: white;
            transition: transform 0.1s, background-color 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            outline: none;
        }

        #actionBtn:active { transform: scale(0.95); }
        #actionBtn.stop { background-color: #c0392b; }

        #message {
            margin-top: 25px;
            font-size: 1.3rem;
            height: 30px;
            color: #ecf0f1;
            font-weight: 500;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>Mục tiêu: <span class="target">10.00s</span></h1>
    
    <div id="timer">00.00</div>
    
    <button id="actionBtn" onclick="toggleTimer()">Bắt đầu</button>
    
    <div id="message"></div>

    <script>
        let startTime;
        let tInterval;
        let running = false;
        const TARGET_TIME = 10.00;

        const timerDisplay = document.getElementById('timer');
        const actionBtn = document.getElementById('actionBtn');
        const messageDisplay = document.getElementById('message');

        function toggleTimer() {
            if (!running) {
                startGame();
            } else {
                stopGame();
            }
        }

        function startGame() {
            startTime = new Date().getTime();
            tInterval = setInterval(updateTimer, 10); // Cập nhật mỗi 10ms (0.01s)
            running = true;
            
            actionBtn.innerHTML = "DỪNG LẠI!";
            actionBtn.className = "stop";
            messageDisplay.innerHTML = ""; 
            timerDisplay.style.color = "white";
        }

        function stopGame() {
            clearInterval(tInterval);
            running = false;
            
            // --- LOGIC MAY MẮN (50%) ---
            // Lấy giá trị thời gian thực tế lúc bấm dừng
            let currentTime = parseFloat(timerDisplay.innerHTML);

            // Kiểm tra nếu nằm trong khoảng 9.98 đến 10.02
            if (currentTime >= 9.98 && currentTime <= 10.02) {
                // Math.random() trả về số từ 0 đến 1. Nếu nhỏ hơn 0.5 (tức là 50%)
                if (Math.random() < 0.5) {
                    timerDisplay.innerHTML = "10.00"; // Ép về 10.00
                    console.log("Đã kích hoạt may mắn!"); // Kiểm tra trong F12 Console
                }
            }
            // ---------------------------

            actionBtn.innerHTML = "Chơi lại";
            actionBtn.className = "";
            
            checkResult();
        }

        function updateTimer() {
            let updatedTime = new Date().getTime();
            let difference = updatedTime - startTime;
            
            let seconds = Math.floor((difference % (1000 * 60)) / 1000);
            let milliseconds = Math.floor((difference % 1000) / 10);

            seconds = (seconds < 10) ? "0" + seconds : seconds;
            milliseconds = (milliseconds < 10) ? "0" + milliseconds : milliseconds;

            timerDisplay.innerHTML = seconds + '.' + milliseconds;
        }

        function checkResult() {
            let finalTime = parseFloat(timerDisplay.innerHTML);
            let diff = Math.abs(TARGET_TIME - finalTime).toFixed(2);
            
            if (diff == 0.00) {
                messageDisplay.innerHTML = "🏆 ĐỈNH CAO! CHUẨN KHÔNG CẦN CHỈNH! 🏆";
                messageDisplay.style.color = "#f1c40f"; // Vàng
                timerDisplay.style.color = "#f1c40f";
            } else if (diff <= 0.10) {
                messageDisplay.innerHTML = `Suýt soát! Lệch ${diff}s.`;
                messageDisplay.style.color = "#2ecc71"; // Xanh lá
            } else {
                messageDisplay.innerHTML = `Lệch ${diff}s. Cố lên!`;
                messageDisplay.style.color = "#ecf0f1"; // Trắng nhạt
            }
        }
        
        // Phím Space để chơi
        document.body.onkeyup = function(e) {
            if (e.code == "Space" || e.keyCode == 32) {
                toggleTimer();
            }
        }
    </script>
</body>
</html>
